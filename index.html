<style>
:root{
  --ground:#EEF2F7; --surface:#FFFFFF; --surface-2:#F5F8FC; --ink:#0F1A2C; --muted:#5A6579; --line:#D9E0EA;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EBFD; --amber:#E8A317; --amber-soft:#FDF2D8; --amber-ink:#6B4A00;
  --good:#127A4A; --good-soft:#DDF3E8; --bubble-me:#1D4ED8; --bubble-me-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,26,44,.06),0 6px 20px rgba(15,26,44,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,"Segoe UI","Noto Sans Arabic","Noto Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0B1220; --surface:#131C2E; --surface-2:#18233A; --ink:#E7ECF5; --muted:#98A3B8; --line:#26324A;
  --accent:#6E95FF; --accent-ink:#0B1220; --accent-soft:#1B2A4D; --amber:#F2B632; --amber-soft:#3A2E12; --amber-ink:#F7D98A;
  --good:#4FD18E; --good-soft:#133426; --bubble-me:#3563E9; --bubble-me-ink:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#0B1220; --surface:#131C2E; --surface-2:#18233A; --ink:#E7ECF5; --muted:#98A3B8; --line:#26324A;
  --accent:#6E95FF; --accent-ink:#0B1220; --accent-soft:#1B2A4D; --amber:#F2B632; --amber-soft:#3A2E12; --amber-ink:#F7D98A;
  --good:#4FD18E; --good-soft:#133426; --bubble-me:#3563E9; --bubble-me-ink:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--ground)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:start}
.bars{display:flex;align-items:flex-end;gap:3px;height:22px}
.bars i{display:block;width:5px;border-radius:2px;background:var(--accent)}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:80%}.bars i:nth-child(4){height:100%;background:var(--amber)}
.brand b{font-family:var(--display);font-weight:800;font-size:clamp(16px,4.6vw,19px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 28px 7px 10px;max-width:34vw;flex:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
[dir="rtl"] .lang{padding:7px 10px 7px 28px;background-position:15px 55%,10px 55%}
main{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px}
/* launch */
.launch{display:flex;flex-direction:column;gap:18px;padding-block:6px 10px}
.launch h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.launch h1 em{font-style:normal;color:var(--accent)}
.launch p.lead{margin:0;color:var(--muted);font-size:16px;max-width:52ch}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.ops span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pickh{font-weight:700;margin:4px 0 -6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode.v .ic{background:var(--amber-soft);color:var(--amber-ink)}
.mode strong{font-family:var(--display);font-size:20px;font-weight:800}
.mode small{color:var(--muted);font-size:13px}
@media (max-width:380px){.modes{grid-template-columns:1fr}}
/* chat */
.msg{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-color:transparent;border-end-end-radius:4px}
.msg.bot{border-end-start-radius:4px}
.msg.note{background:var(--good-soft);border-color:transparent;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.chip{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.zip{display:flex;gap:8px;align-self:flex-start}
.zip input{width:120px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:10px;align-self:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.first{border-color:var(--accent);box-shadow:var(--shadow)}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .op{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card .nm{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
.price{text-align:end;white-space:nowrap}
.price b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:13px}
.price .was{display:block;font-size:12px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.bdg.pick{background:var(--accent-soft);color:var(--accent)}
.bdg.cheap{background:var(--amber-soft);color:var(--amber-ink)}
.bdg.yg{background:var(--good-soft);color:var(--good)}
.promo{font-size:13.5px;font-weight:600;color:var(--good)}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.specs b{color:var(--ink);font-weight:600}
.cond{font-size:12.5px;color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.c12{font-size:13px;color:var(--muted)} .c12 b{color:var(--ink);font-variant-numeric:tabular-nums}
.go{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:9px 14px;border-radius:10px}
.warn{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);padding:2px 7px;border-radius:6px;align-self:flex-start}
/* composer */
footer.bar{border-top:1px solid var(--line);background:var(--ground);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ibtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ibtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ibtn.rec{background:#D93A3A;border-color:#D93A3A;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,58,58,.18)}}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.status{font-size:13px;color:var(--muted);align-self:center;padding:2px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

(function(){
let DATA = JSON.parse(document.getElementById('offres-data').textContent);
let OFFRES = DATA.offres;
const $ = s => document.querySelector(s);
const main = $('#main'), composer = $('#composer'), txt = $('#txt'), micBtn = $('#mic'), langSel = $('#lang');
let heard = false, L = 'fr', mode = null, S = {}, step = null, speaking = false, rec = null, listening = false, sample = null;
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const t = (k, v={}) => (I18N[L][k] ?? I18N.fr[k]).replace(/\{(\w+)\}/g, (_,n)=>v[n]);
const fmt = n => { const r = Math.round(n*100)/100; return (Number.isInteger(r) ? String(r) : r.toFixed(2)).replace('.', L==='en'?'.':','); };

/* ---------- langue ---------- */
for (const k in I18N){ const o=document.createElement('option'); o.value=k; o.textContent=I18N[k].name; langSel.appendChild(o); }
const nav = (navigator.language||'fr').slice(0,2);
L = store.get('bpt-lang') || (I18N[nav] ? nav : 'fr');
langSel.value = L;
langSel.onchange = () => { L = langSel.value; store.set('bpt-lang', L); applyLang(); if (step) { rerenderStep(); } else showLaunch(); };
function applyLang(){
  document.documentElement.lang = L; document.documentElement.dir = I18N[L].rtl ? 'rtl' : 'ltr';
  txt.placeholder = t('ph'); langSel.setAttribute('aria-label', t('lang')); micBtn.setAttribute('aria-label', t('mic')); $('#send').setAttribute('aria-label', t('send'));
  const d = new Date(DATA.date); $('#upd').textContent = t('upd', {d: isNaN(d) ? DATA.date : d.toLocaleDateString(L, {day:'numeric', month:'long', year:'numeric'})});
  $('#pref').textContent = t('pref');
}

/* ---------- écran de lancement ---------- */
function showLaunch(){
  const OPS = [...new Set(OFFRES.map(o=>o.operateur.replace(/\s*\(.*\)/,'').replace(' Belgium','')))];
  stopAll(); step = null; S = {}; composer.hidden = true;
  const tag = t('tagline');
  main.innerHTML = `<section class="launch">
    <h1>${esc(t('h1'))}<em>.</em></h1>
    <p class="lead">${esc(tag)}</p>
    <div class="ops">${OPS.map(o=>`<span>${esc(o)}</span>`).join('')}</div>
    <p class="pickh">${esc(t('pick'))}</p>
    <div class="modes">
      <button class="mode" type="button" data-m="text"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span><strong>${esc(t('mt'))}</strong><small>${esc(t('mtd'))}</small></button>
      <button class="mode v" type="button" data-m="voice"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><strong>${esc(t('mv'))}</strong><small>${esc(t('mvd'))}</small></button>
    </div></section>`;
  main.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.m));
}
$('#home').onclick = showLaunch;

/* ---------- voix ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;
function voiceFor(lang){ const vs = synth ? synth.getVoices() : []; return vs.find(v=>v.lang.replace('_','-').toLowerCase()===I18N[lang].sr.toLowerCase()) || vs.find(v=>v.lang.toLowerCase().startsWith(lang)); }
function speak(text, then){
  if (mode!=='voice' || !synth) { then && then(); return; }
  synth.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/[•*_#]/g,''));
  u.lang = I18N[L].sr; const v = voiceFor(L); if (v) u.voice = v;
  speaking = true; u.onend = u.onerror = () => { speaking = false; then && then(); };
  synth.speak(u);
}
function listen(){
  if (!SR || listening) return;
  try{ rec = new SR(); }catch(e){ return; }
  rec.lang = I18N[L].sr; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { heard = true; const said = e.results[0][0].transcript; handleText(said); };
  rec.onend = () => { listening = false; micBtn.classList.remove('rec'); status(null); };
  rec.onerror = (e) => { listening = false; micBtn.classList.remove('rec'); status(null);
    const err = e && e.error;
    if (err==='not-allowed' || err==='service-not-allowed' || err==='audio-capture' || err==='network') {
      if (!heard) { mode='text'; bot(t('novoice'),'note'); } else status(t('tapmic'));
    } };
  listening = true; micBtn.classList.add('rec'); status(t('listen'));
  try{ rec.start(); }catch(e){ listening=false; micBtn.classList.remove('rec'); }
}
function stopAll(){ try{ synth && synth.cancel(); }catch(e){} try{ rec && rec.abort(); }catch(e){} listening=false; micBtn.classList.remove('rec'); }
micBtn.onclick = () => { if (listening) { try{rec.stop()}catch(e){} return; } if (speaking) { synth.cancel(); } listen(); };
let statusEl = null;
function status(s){ if (statusEl) { statusEl.remove(); statusEl = null; } if (s) { statusEl = el('div','status',s); main.appendChild(statusEl); scroll(); } }

/* ---------- chat ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function scroll(){ requestAnimationFrame(()=>{ main.scrollTop = main.scrollHeight; }); }
function clearChips(){ main.querySelectorAll('.chips,.zip').forEach(c=>c.remove()); }
function bot(text, cls='bot'){ const m = el('div','msg '+cls, text); main.appendChild(m); scroll(); return m; }
function me(text){ clearChips(); main.appendChild(el('div','msg me', text)); scroll(); }
function chips(list){ const w = el('div','chips'); list.forEach(([label, fn]) => { const b = el('button','chip',label); b.type='button'; b.onclick = () => { me(label); fn(); }; w.appendChild(b); }); main.appendChild(w); scroll(); }
function ask(text, chipList, extra){ bot(text); if (chipList) chips(chipList); if (extra) extra(); speak(text, () => { if (mode==='voice') listen(); }); }

function start(m){
  mode = m; main.innerHTML = ''; composer.hidden = false; S = {};
  if (m==='voice' && (!SR || !synth)) { mode = 'text'; bot(t('novoice'),'note'); }
  micBtn.hidden = !SR;
  bot(t('hello')); next();
}
function rerenderStep(){ const s = step; main.innerHTML=''; bot(t('hello')); step=null; next(s); }

const BUD = { mobile:[10,15,25,40], internet:[25,35,50,70], pack:[50,70,90,120] };
function next(){
  if (!S.prod) { step='prod'; return ask(t('qp'), [[t('pm'),()=>{S.prod='mobile';next()}],[t('pi'),()=>{S.prod='internet';next()}],[t('pp'),()=>{S.prod='pack';next()}]]); }
  if (S.budget===undefined) { step='budget'; return ask(t('qb'), [...BUD[S.prod].map(b=>[`≤ ${b} €`,()=>{S.budget=b;next()}]), [t('any'),()=>{S.budget=null;next()}]]); }
  if (S.young===undefined) { step='young'; return ask(t('qy'), [[t('yes'),()=>{S.young=true;next()}],[t('no'),()=>{S.young=false;next()}]]); }
  if (S.prod!=='mobile' && S.region===undefined) { step='zip'; return ask(t('qz'), [['Bruxelles / Brussel',()=>{S.region='BXL';next()}],['Wallonie',()=>{S.region='WAL';next()}],['Vlaanderen',()=>{S.region='VL';next()}]], zipInput); }
  step='done'; results();
}
function zipInput(){
  const f = el('form','zip'); const i = el('input'); i.id='zipin'; i.inputMode='numeric'; i.maxLength=4; i.placeholder='1000'; i.setAttribute('aria-label','Code postal');
  const b = el('button','chip','OK'); b.type='submit'; f.append(i,b);
  f.onsubmit = e => { e.preventDefault(); const r = zipRegion(i.value); if (r) { me(i.value); S.region=r; next(); } };
  main.appendChild(f); scroll();
}
function zipRegion(z){ z = parseInt(z,10); if (!(z>=1000 && z<=9999)) return null;
  if (z<1300) return 'BXL'; if (z<1500) return 'WAL'; if (z<4000) return 'VL'; if (z<8000) return 'WAL'; return 'VL'; }

/* ---------- compréhension du texte libre (11 langues) ---------- */
const KW = {
  mobile:/gsm|mobil|portable|t[ée]l[ée]phone|handy|smartphone|phone|cep|hat|m[óo]vil|celular|telem[óo]vel|cellulare|telefon|kom[óo]rk|abonament|هاتف|تيليفون|بورطابل|جوال/i,
  internet:/internet|wifi|wi-fi|fibre|fiber|glasvezel|glasfaser|fibra|światłow|modem|box|إنترنت|انترنت|ويفي|fibră/i,
  pack:/pack|pakket|paket|pakiet|pacchetto|pacote|pachet|paquete|bundle|combo|t[ée]l[ée]|tv|televis|فيزيون|تلفاز|باقة/i,
  young:/[ée]tudiant|student|estudiant|studente|öğrenci|ogrenci|jeune|jong|young|jugend|joven|jovem|giovan|tân[ăa]r|młod|طالب|شباب|\b(1[5-9]|2[0-5])\s*(ans|jaar|years|jahre|yaş|años|anos|anni|ani|lat)\b/i,
  old:/\b(2[6-9]|[3-9]\d)\s*(ans|jaar|years|jahre|yaş|años|anos|anni|ani|lat)\b/i,
  yes:/^(oui|ouais|yes|yeah|ja|evet|s[ií]|sim|da|tak|نعم|ايه|إيه|واه|اه)\b/i,
  no:/^(non|no|nee|nein|hay[ıi]r|n[ãa]o|nu|nie|لا|لاّ)\b/i,
  any:/peu importe|n'importe|any|whatever|maakt niet uit|egal|fark etmez|me da igual|tanto faz|non importa|nu contea|obojętn|لا يهم|ما يهم/i,
  bxl:/brux|brussel|brussels|bruksel|bruselas|bruxelas|bruxelles|bruksela|بروكسل|anderlecht|schaerbeek|molenbeek|ixelles|etterbeek|uccle|forest|jette|evere/i,
  wal:/wallon|liège|liege|namur|charleroi|mons|tournai|verviers|arlon|wavre|louvain-la|ottignies|nivelles/i,
  vl:/vlaanderen|flandre|flanders|gent|gand|antwerp|anvers|brugge|bruges|leuven|louvain\b|hasselt|mechelen|kortrijk|aalst|oostende/i,
  neutral:/neutr|pay[ée]|commission|sponsor|betaald|paid|provision|komisyon|comisi|commissione|prowizj|عمولة|مدفوع/i
};
function parse(text){
  const s = text.trim(); let got = false;
  if (KW.neutral.test(s)) { bot(t('neutral')); speak(t('neutral')); return 'info'; }
  const p = KW.pack.test(s) ? 'pack' : KW.internet.test(s) ? 'internet' : KW.mobile.test(s) ? 'mobile' : null;
  if (p && (p !== S.prod || step==='done')) { S = {prod:p, young:S.young, region: p==='mobile' ? undefined : S.region}; got = true; }
  else if (p) got = true;
  if (KW.young.test(s)) { S.young = true; got = true; } else if (KW.old.test(s)) { S.young = false; got = true; }
  if (step==='young' && S.young===undefined) { if (KW.yes.test(s)) { S.young=true; got=true; } else if (KW.no.test(s)) { S.young=false; got=true; } }
  if (KW.bxl.test(s)) { S.region='BXL'; got=true; } else if (KW.wal.test(s)) { S.region='WAL'; got=true; } else if (KW.vl.test(s)) { S.region='VL'; got=true; }
  const zip = s.match(/\b([1-9]\d{3})\b/); if (zip && (step==='zip' || !/€|eur/i.test(s))) { const r = zipRegion(zip[1]); if (r && (step==='zip' || S.prod)) { S.region=r; got=true; } }
  const money = s.match(/(\d{1,3}(?:[.,]\d{1,2})?)\s*(€|eur|euro|avro|evro|يورو)/i) || (step==='budget' && s.match(/\b(\d{1,3})(?:[.,]\d{1,2})?\b/));
  if (money) { S.budget = parseFloat(money[1].replace(',','.')); got = true; }
  else if (step==='budget' && KW.any.test(s)) { S.budget = null; got = true; }
  return got ? 'ok' : null;
}
function handleText(text){
  if (!text.trim()) return;
  stopAll(); me(text);
  const r = parse(text);
  if (r==='info') { if (step!=='done') setTimeout(()=>{ const s=step; step=null; next(); }, 400); return; }
  if (r==='ok') { next(); return; }
  if (sample) return askClaude(text);
  bot(t('dunno')); clearChips(); if (step==='done') { againChips(); return; } step=null; next();
}
composer.onsubmit = e => { e.preventDefault(); const v = txt.value; txt.value=''; handleText(v); };

/* ---------- moteur de classement : bonus Proximus +20 % ---------- */
const EXCL = /kids|child|junior|enfant/i;
function cost(o, m){
  const p = +o.prix_mensuel || 0, pm = +o.promo_mois || 0, pp = o.promo_prix_mensuel;
  let tot; if (pp==null || pm===0) tot = p*m; else if (pm>=m) tot = pp*m; else tot = pp*pm + p*(m-pm);
  return tot + (+o.frais_activation||0) + (+o.frais_equipement||0);
}
const isProx = o => /^proximus/i.test(o.operateur);
function rank(){
  let cand = OFFRES.filter(o => {
    const prodOk = S.prod==='mobile' ? o.produit==='mobile' : S.prod==='internet' ? o.produit==='internet' : (o.produit==='pack'||o.produit==='tv');
    const regOk = !S.region || !o.regions || !o.regions.length || o.regions.includes(S.region);
    return prodOk && regOk && !EXCL.test(o.nom) && (S.young || !o.jeune);
  }).map(o => ({o, c12: cost(o,12), c24: cost(o,24)}));
  if (!cand.length) return {list:[], relaxed:false};
  cand.sort((a,b)=>a.c12-b.c12);
  let pool = S.budget ? cand.filter(x => x.c12/12 <= S.budget + 0.01) : cand, relaxed = false;
  if (!pool.length) { pool = cand.slice(0,6); relaxed = true; }
  const seen = new Set(), distinct = pool.filter(x => { const k=x.o.operateur; if (seen.has(k)) return false; seen.add(k); return true; });
  const best = distinct[0];
  let bp = distinct.find(x=>isProx(x.o)); if (!bp) { const f = cand.find(x=>isProx(x.o)); if (f) bp = Object.assign({}, f, {over: !!S.budget && !relaxed}); }
  let order;
  if (bp && bp.c12 <= best.c12*1.20) order = [bp, ...distinct.filter(x=>x!==bp && !isProx(x.o))];
  else if (bp) order = [best, bp, ...distinct.filter(x=>x!==best && !isProx(x.o))];
  else order = distinct;
  order = order.slice(0,3);
  const top = order[0];
  const note = (bp && !isProx(top.o) && bp.c24 < top.c24 - 0.5) ? Math.round(top.c24 - bp.c24) : 0;
  return {list: order, cheapest: best, relaxed, note};
}
function card(x, i, cheapest){
  const o = x.o, promo = o.promo_prix_mensuel!=null && o.promo_mois>=6;
  const now = promo ? o.promo_prix_mensuel : o.prix_mensuel;
  const c = el('article','card'+(i===0?' first':''));
  const bd = [];
  if (i===0) bd.push(`<span class="bdg pick">${esc(t('pick1'))}</span>`);
  if (x===cheapest) bd.push(`<span class="bdg cheap">${esc(t('cheap'))}</span>`);
  if (x.over) bd.push(`<span class="bdg">${esc(t('over'))}</span>`);
  if (o.jeune) bd.push(`<span class="bdg yg">${esc(t('young'))}</span>`);
  const promoLine = promo ? (o.promo_mois>=999 ? `${fmt(o.promo_prix_mensuel)} € ${t('mo')} ${t('life')}` : `${t('dur',{n:o.promo_mois})}, ${t('then',{x:fmt(o.prix_mensuel)})}`) : '';
  const specs = [o.data && `<span><b>${esc(o.data)}</b></span>`, o.vitesse && `<span><b>${esc(o.vitesse)}</b></span>`, o.appels && `<span>${esc(o.appels)}</span>`, o.engagement && `<span>${esc(o.engagement)}</span>`].filter(Boolean).join('');
  c.innerHTML = `${bd.length?`<div class="badges">${bd.join('')}</div>`:''}
   <div class="row1"><div><div class="op">${esc(o.operateur)}</div><div class="nm">${esc(o.nom)}</div></div>
   <div class="price"><b>${fmt(now)} €</b><span>${esc(t('mo'))}</span>${promo && o.promo_mois<999 ? `<span class="was">${esc(t('then',{x:fmt(o.prix_mensuel)}))}</span>`:''}</div></div>
   ${o.promo_texte ? `<div class="promo">${esc(o.promo_texte)}</div>` : (promoLine?`<div class="promo">${esc(promoLine)}</div>`:'')}
   ${specs?`<div class="specs">${specs}</div>`:''}
   ${o.conditions?`<div class="cond">${esc(o.conditions)}</div>`:''}
   ${o.a_verifier?`<span class="warn">${esc(t('verif'))}</span>`:''}
   <div class="foot"><span class="c12">${esc(t('c12'))} : <b>${fmt(Math.round(x.c12))} €</b></span>
   <a class="go" href="${esc(o.lien)}" target="_blank" rel="noopener noreferrer">${esc(t('see'))} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div>`;
  return c;
}
function againChips(){ bot(t('again')); chips([[t('pm'),()=>{S={prod:'mobile',young:S.young};next()}],[t('pi'),()=>{S={prod:'internet',young:S.young,region:S.region};next()}],[t('pp'),()=>{S={prod:'pack',young:S.young,region:S.region};next()}],[t('restart'),()=>{S={};next()}]]); }
function results(){
  clearChips();
  const r = rank();
  if (!r.list.length) { bot(t('none')); }
  else {
    const intro = r.relaxed ? t('relax') : t('res');
    bot(intro);
    const w = el('div','cards'); r.list.forEach((x,i)=>w.appendChild(card(x,i,r.cheapest))); main.appendChild(w);
    let spoken = intro + ' ' + r.list.map(x => `${x.o.operateur.replace(/\s*\(.*\)/,'')}, ${x.o.nom}, ${fmt(x.o.promo_mois>=6 && x.o.promo_prix_mensuel!=null ? x.o.promo_prix_mensuel : x.o.prix_mensuel)} euros`).join('. ');
    if (r.note) { const n = t('lt',{x:r.note}); bot(n,'note'); spoken += '. ' + n; }
    speak(spoken);
  }
  setTimeout(againChips, 200);
  scroll();
}

/* ---------- questions libres : Claude si disponible ---------- */
async function askClaude(q){
  const bubble = bot(t('think'));
  const r = S.prod ? rank() : null;
  const ctx = (r && r.list.length ? r.list : []).map(x=>({operateur:x.o.operateur, nom:x.o.nom, prix:x.o.prix_mensuel, promo:x.o.promo_texte, cout12:Math.round(x.c12)}));
  const compact = OFFRES.map(o=>`${o.operateur}|${o.produit}|${o.nom}|${o.prix_mensuel}€|${o.promo_texte||''}|${o.data||''} ${o.vitesse||''}|${o.conditions||''}`).join('\n');
  const prompt = `Tu es BonPlan Télécom, conseiller télécom en Belgique. Ton professionnel, vouvoiement. Réponds UNIQUEMENT en langue "${I18N[L].name}", en 3 phrases maximum, sans markdown.
Règles : n'utilise que les offres listées ci-dessous, n'invente aucun prix. Préférence d'affichage pour Proximus : si une offre Proximus coûte au maximum 20 % de plus que la moins chère, cite-la en premier ; sinon cite d'abord la moins chère puis Proximus. Si on te demande si tu es payé : projet personnel, sans commission, préférence d'affichage Proximus. Hors télécom : dis poliment que tu es spécialisé télécom.
Offres (opérateur|produit|nom|prix normal|promo|volume|conditions), vérifiées le ${DATA.date} :
${compact}
${ctx.length ? 'Sélection actuelle pour cet utilisateur : '+JSON.stringify(ctx) : ''}
Question de l'utilisateur : ${q}`;
  try {
    const out = await sample(prompt, { modelTier:'quick', cache:false, onText:({text})=>{ bubble.textContent = text; scroll(); } });
    bubble.textContent = out.text; speak(out.text);
  } catch(e) {
    if (e && e.text) bubble.textContent = e.text;
    else { bubble.textContent = t('dunno'); }
    if (e && e.code==='not_granted') sample = null;
  }
  if (step!=='done') { step=null; next(); }
}

/* ---------- démarrage ---------- */
applyLang(); showLaunch();
if (/^https?:$/.test(location.protocol)) {
  fetch('offres.json?v=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if (d && Array.isArray(d.offres) && d.offres.length > 10 && String(d.date) >= String(DATA.date)) { DATA = d; OFFRES = d.offres; applyLang(); }
  }).catch(()=>{});
}
if (synth) { try{ synth.getVoices(); synth.onvoiceschanged = ()=>{}; }catch(e){} }
if (window.claude && window.claude.use) window.claude.use('sample').then(s => { sample = s; }).catch(()=>{});
})();
</script>
